<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Watchio w colon logo</title>
  <desc id="desc">A dark rounded square with a blue w colon monogram and a green status light.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b25"/>
      <stop offset="1" stop-color="#080b11"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bg)"/>
  <rect x="21" y="21" width="470" height="470" rx="107" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <text x="256" y="318" text-anchor="middle" fill="url(#mark)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="230" font-weight="800">w:</text>
  <circle cx="420" cy="100" r="24" fill="#3fb950"/>
  <circle cx="420" cy="100" r="36" fill="#3fb950" opacity=".15"/>
</svg>
