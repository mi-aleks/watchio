name: Bug report
description: Report a reproducible Watchio problem with sanitized details.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Never paste environment values, raw arguments, usernames, full home paths, real PIDs, or proprietary project names.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Detection, Menu bar, Widget, Settings, Build, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Watchio version or commit
      placeholder: 0.1.0-alpha.1 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS and Xcode
      placeholder: macOS 14.7, Xcode 16.2, Apple M2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Use demo/sanitized data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: health
    attributes:
      label: Sanitized source health and confidence evidence
      description: Do not include full commands, paths, PIDs, or environment data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, usernames, full paths, PIDs, arguments, and proprietary names.
          required: true
        - label: This is not a security vulnerability; if it is, I will use private vulnerability reporting.
          required: true
